<!DOCTYPE html>
<html>
<head>
<title>Mobile Banking App</title>

<style>
body{
    background:black;
    color:#00ff00;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#000000;
    width:350px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,255,0,0.2);
}

h2{
    text-align:center;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#0000ff;
    color:black;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#0000ff;
    color:black;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

#status{
    margin-top:15px;
    text-align:center;
    color:#00ff00;
}
</style>
</head>

<body>

<div class="container">

<h2>Bank Mobile App</h2>

<input type="text" id="account" placeholder="Account Number">

<input type="number" id="amount" placeholder="Withdrawal Amount">

<textarea id="denominations" rows="5"
placeholder="Example:
2000,1000,1000,500,100,100"></textarea>

<button onclick="sendData()">Send To ATM</button>

<div id="status"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const session_id = params.get("session");

async function sendData(){

    const account = document.getElementById("account").value;
    const amount = document.getElementById("amount").value;
    const denominations = document.getElementById("denominations").value;

    if(!session_id){
        document.getElementById("status").innerText =
        "No ATM session detected!";
        return;
    }

    const response = await fetch("/send",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            session_id,
            account,
            amount,
            denominations
        })
    });

    const data = await response.json();

    document.getElementById("status").innerText =
    "Transaction Sent Successfully!";
}

</script>

</body>
</html>
