<!DOCTYPE html>
<html>
<head>
<title>ATM Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    background:black;
    color:#00ff00;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#000000;
    width:400px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,255,0,0.3);
}

.data-box{
    background:#0000ff;
    color:black;
    padding:15px;
    border-radius:12px;
    margin-top:20px;
}

button{
    background:#0000ff;
    color:black;
    border:none;
    padding:12px 20px;
    margin-top:15px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

#status{
    margin-top:20px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h2>ATM Simulator</h2>

<div id="qr"></div>

<div id="data" class="data-box" style="display:none;">
    <p id="info"></p>

    <button onclick="act('approved')">Proceed</button>
    <button onclick="act('cancelled')">Cancel</button>
</div>

<div id="status"></div>

</div>

<script>

const session_id = "{{session_id}}";

// CHANGE THIS AFTER RENDER DEPLOY
const mobileURL = "https://your-render-url.onrender.com/mobile";

new QRCode(document.getElementById("qr"),
    mobileURL + "?session=" + session_id
);

async function check(){

    const r = await fetch("/session/" + session_id);
    const d = await r.json();

    if(d.status === "received"){

        document.getElementById("data").style.display = "block";

        document.getElementById("info").innerText =
            "Account: " + d.data.account +
            "\nAmount: " + d.data.amount +
            "\nDenominations: " + d.data.denominations;
    }

    if(d.status === "approved"){
        document.getElementById("status").innerText =
        "💸 Dispensing Cash...";
    }

    if(d.status === "cancelled"){
        document.getElementById("status").innerText =
        "❌ Transaction Cancelled";
    }
}

setInterval(check,1000);

function act(action){

    fetch("/action/" + session_id + "/" + action,{
        method:"POST"
    });

}

</script>

</body>
</html>
